description: |
  Photo-z estimators from this package (and BPZ)
tasks:
  photoz_bpz:
    class: lsst.meas.photoz.base.estimate_photoz_task_bpz.EstimatePhotozBPZTask
    config:
      connections.photozModel: 'photozModel_bpz'
      connections.photozEnsemble: 'photoz_estimate_bpz'
  photoz_dnf:
    class: lsst.meas.photoz.extensions.estimate_photoz_task_dnf.EstimatePhotozDNFTask
    config:
      connections.photozModel: 'photozModel_dnf'
      connections.photozEnsemble: 'photoz_estimate_dnf'
  photoz_fzboost:
    class: lsst.meas.photoz.extensions.estimate_photoz_task_fzboost.EstimatePhotozFZBoostTask
    config:
      connections.photozModel: 'photozModel_fzboost'
      connections.photozEnsemble: 'photoz_estimate_fzboost'
  photoz_gpz:
    class: lsst.meas.photoz.extensions.estimate_photoz_task_gpz.EstimatePhotozGPZTask
    config:
      connections.photozModel: 'photozModel_gpz'
      connections.photozEnsemble: 'photoz_estimate_gpz'
  photoz_tpz:
    class: lsst.meas.photoz.extensions.estimate_photoz_task_tpz.EstimatePhotozTPZTask
    config:
      connections.photozModel: 'photozModel_tpz'
      connections.photozEnsemble: 'photoz_estimate_tpz'
  photoz_lephare:
    class: lsst.meas.photoz.extensions.estimate_photoz_task_lephare.EstimatePhotozLephareTask
    config:
      connections.photozModel: 'photozModel_lephare'
      connections.photozEnsemble: 'photoz_estimate_lephare'      
  photoz_cmnn:
    class: lsst.meas.photoz.extensions.estimate_photoz_task_cmnn.EstimatePhotozCMNNTask
    config:
      connections.photozModel: 'photozModel_cmnn'
      connections.photozEnsemble: 'photoz_estimate_cmnn'

subsets:
  photoz_all:
    subset:
      - photoz_bpz
      - photoz_dnf
      - photoz_fzboost
      - photoz_gpz
      - photoz_tpz
      - photoz_cmnn
      - photoz_lephare
    description: |
      All of the photoz algorithms
